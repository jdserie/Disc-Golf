{% extends 'base.html' %}
{% block title %}Sign in · Indy Disc Golf{% endblock %}
{% block content %}
<section class="section"><h1>Sign in</h1>
  <form method="post" class="panel form-panel">
    {% csrf_token %}{{ form.as_div }}
    <input type="hidden" name="next" value="{{ next }}">
    <button class="button">Sign in</button>
  </form>
  <p>New here? <a href="{% url 'register' %}">Create an account</a></p>
</section>
{% endblock %}
