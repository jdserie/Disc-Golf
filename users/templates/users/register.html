{% extends 'base.html' %}
{% block title %}Create an account · Indy Disc Golf{% endblock %}
{% block content %}
<section class="section"><h1>Create an account</h1>
  <form method="post" class="panel form-panel">{% csrf_token %}{{ form.as_div }}<button class="button">Create account</button></form>
  <p>Already have an account? <a href="{% url 'login' %}">Sign in</a></p>
</section>
{% endblock %}
