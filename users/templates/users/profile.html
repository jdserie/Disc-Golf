{% extends 'base.html' %}
{% block title %}Profile · Indy Disc Golf{% endblock %}
{% block content %}
<section class="section"><h1>Your profile</h1>
  {% if has_profile_image %}<img class="account-img" src="{{ user.profile.image.url }}" alt="">{% endif %}
  <form method="post" enctype="multipart/form-data" class="panel form-panel">
    {% csrf_token %}{{ u_form.as_div }}{{ p_form.as_div }}<button class="button">Save profile</button>
  </form>
</section>
{% endblock %}
