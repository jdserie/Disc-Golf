<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="{% url 'pages-home' %}"><span class="disc-mark" aria-hidden="true"></span>Indy Disc Golf</a>
    <nav aria-label="Main navigation">
      <a href="{% url 'courseHome' %}">Courses</a>
      <a href="{% url 'reviewCourse' %}">Reviews</a>
      {% if user.is_authenticated %}
        <a href="{% url 'profile' %}">Profile</a>
        <form action="{% url 'logout' %}" method="post">{% csrf_token %}<button class="nav-action">Sign out</button></form>
      {% else %}
        <a href="{% url 'login' %}">Sign in</a>
      {% endif %}
    </nav>
  </div>
</header>
